# Deployed from this machine with `npm run deploy` (builds locally, uploads ./out).
[build]
  publish = "out"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Next.js static export inlines bootstrap scripts/styles, hence 'unsafe-inline'.
    # connect-src: AppSync (HTTPS + realtime WebSocket) and Cognito in us-east-2.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.appsync-api.us-east-2.amazonaws.com wss://*.appsync-realtime-api.us-east-2.amazonaws.com https://cognito-idp.us-east-2.amazonaws.com https://cognito-identity.us-east-2.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Board art changes rarely but is re-cut sometimes: let browsers revalidate.
[[headers]]
  for = "/board/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
